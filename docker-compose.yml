# Docker Compose for monitoring-scholarship-app
# Full-stack container orchestration

name: monitoring-scholarship-app

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3001}
    container_name: monitoring-scholarship-app-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - monitoring-scholarship-app-network

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: monitoring-scholarship-app-server
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@db:5432/monitoring-scholarship-app}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in your shell or Compose env file}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3001}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - monitoring-scholarship-app-network

  db:
    image: postgres:16-alpine
    container_name: monitoring-scholarship-app-postgres
    environment:
      POSTGRES_DB: monitoring-scholarship-app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - monitoring-scholarship-app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - monitoring-scholarship-app-network

networks:
  monitoring-scholarship-app-network:
    driver: bridge

volumes:
  monitoring-scholarship-app_postgres_data:
