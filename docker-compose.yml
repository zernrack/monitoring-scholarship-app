# Docker Compose for monitoring-scholarship-app
# Full-stack container orchestration

name: monitoring-scholarship-app

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: monitoring-scholarship-app-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://server:3001
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - monitoring-scholarship-app-network

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: monitoring-scholarship-app-server
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:password@db:5432/monitoring-scholarship-app
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - monitoring-scholarship-app-network

  db:
    image: postgres:16-alpine
    container_name: monitoring-scholarship-app-postgres
    environment:
      POSTGRES_DB: monitoring-scholarship-app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - monitoring-scholarship-app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - monitoring-scholarship-app-network

networks:
  monitoring-scholarship-app-network:
    driver: bridge

volumes:
  monitoring-scholarship-app_postgres_data:
